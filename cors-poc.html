<!DOCTYPE html>
<html><body>
<script>
fetch('https://mijn.gamma.nl/api/profile', {credentials: 'include'})
  .then(r => {
    console.log('status:', r.status, 'ACAO:', r.headers.get('access-control-allow-origin'));
    return r.text();
  })
  .then(t => { console.log('body:', t); document.body.textContent = t.slice(0, 2000); })
  .catch(e => console.error('CORS blocked or network error:', e));
</script>
</body></html>
